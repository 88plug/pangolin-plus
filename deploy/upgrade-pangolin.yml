---
# Pangolin Safe Upgrade - Backup, optional image pin, health check, auto-rollback
# Usage: ansible-playbook -i inventory.ini upgrade-pangolin.yml
#
# Defaults target **published pangolin-plus** images on GHCR (pull_images: true).
# Bump the tag when cutting a new vX.Y.Z-plus release, or override -e.
#
# Plus local tags (pangolin-plus/*:local already loaded on the host):
#   ansible-playbook -i inventory.ini upgrade-pangolin.yml \
#     -e pangolin_image=pangolin-plus/pangolin:local \
#     -e gerbil_image=pangolin-plus/gerbil:local \
#     -e pull_images=false
#
# Upstream stock (fosrl) fallback:
#   -e pangolin_image=fosrl/pangolin:1.21.1 \
#   -e gerbil_image=fosrl/gerbil:latest \
#   -e pull_images=true \
#   -e force_demote=true   # required if on-disk is already plus
#
# Full plus re-deploy (compose + badger + config): re-run pangolin.yml instead.
#
# Features:
#   - Pre-upgrade health check (fails if already unhealthy)
#   - Full config backup with timestamp
#   - Graceful container stop
#   - Rewrite compose image lines from vars (pangolin/gerbil/traefik)
#   - Optional pull (skipped for local-only names; refused if pull + pangolin-plus/*)
#   - Optional monorepo badger re-sync (localPlugins)
#   - Post-upgrade health check with timeout
#   - Auto-generated rollback.sh script
#   - Backup cleanup (keeps last N backups)

- hosts: pangolin_vps
  become: true
  vars:
    pangolin_dir: "/opt/pangolin"
    backup_dir: "/opt/pangolin/backups"
    backup_retention_count: 5

    # Full image refs written into docker-compose.yml before up.
    # Product default = published GHCR plus (match latest release tag).
    # Local: pangolin-plus/pangolin:local + pull_images=false
    # Stock: fosrl/pangolin:1.21.1 + force_demote=true if leaving plus
    pangolin_image: "ghcr.io/88plug/pangolin-plus/pangolin:v1.21.1-plus"
    gerbil_image: "ghcr.io/88plug/pangolin-plus/gerbil:v1.21.1-plus"
    traefik_image: "traefik:v3.7"
    # true = docker compose pull (registry). false = local tags only.
    pull_images: true
    # Re-copy monorepo components/badger when present on the control node
    resync_badger: true
    # Required to switch off an on-disk plus deploy onto stock (fosrl/*) etc.
    force_demote: false

    health_check_retries: 30
    health_check_delay: 10

  tasks:
    - name: Get current timestamp
      set_fact:
        backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

    - name: Pre-upgrade health check
      shell: |
        docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' pangolin 2>/dev/null || echo "not_running"
      register: pre_health
      changed_when: false

    - name: Get current image versions before upgrade
      shell: |
        echo "pangolin:$(docker inspect --format='{{ '{{' }}.Config.Image{{ '}}' }}' pangolin 2>/dev/null || echo 'none')"
        echo "gerbil:$(docker inspect --format='{{ '{{' }}.Config.Image{{ '}}' }}' gerbil 2>/dev/null || echo 'none')"
        echo "traefik:$(docker inspect --format='{{ '{{' }}.Config.Image{{ '}}' }}' traefik 2>/dev/null || echo 'none')"
      register: current_versions
      changed_when: false

    - name: Read on-disk compose pangolin image
      shell: |
        set -e
        f="{{ pangolin_dir }}/docker-compose.yml"
        if [ ! -f "$f" ]; then echo "none"; exit 0; fi
        awk '
          /^[[:space:]]*pangolin:[[:space:]]*$/ { in_svc=1; next }
          in_svc && /^[[:space:]]*[a-zA-Z0-9_-]+:[[:space:]]*$/ { in_svc=0 }
          in_svc && /^[[:space:]]*image:[[:space:]]*/ {
            sub(/^[[:space:]]*image:[[:space:]]*/, "")
            gsub(/["\047]/, "")
            print
            exit
          }
        ' "$f"
      args:
        executable: /bin/bash
      register: on_disk_pangolin
      changed_when: false
      failed_when: false

    - name: Display pre-upgrade status
      debug:
        msg: |
          Pre-upgrade status:
            Health: {{ pre_health.stdout }}
            On-disk pangolin image: {{ on_disk_pangolin.stdout | default('none') }}
            Target images: {{ pangolin_image }} / {{ gerbil_image }} / {{ traefik_image }}
            pull_images: {{ pull_images }}
            Current versions:
          {{ current_versions.stdout | indent(4) }}

    - name: Fail if Pangolin is not healthy (unless not running)
      fail:
        msg: "Pangolin is unhealthy ({{ pre_health.stdout }}). Fix issues before upgrading."
      when: pre_health.stdout not in ['healthy', 'not_running']

    - name: Reject Hub pull of local-only pangolin-plus/* image names
      assert:
        that:
          - not (pull_images | bool) or not (pangolin_image is match('^pangolin-plus/'))
          - not (pull_images | bool) or not (gerbil_image is match('^pangolin-plus/'))
        fail_msg: >-
          pull_images=true cannot use local-only image names (pangolin-plus/*).
          Load images first (make plus-images) and re-run with pull_images=false,
          or push to a registry and set ghcr.io/... tags with pull_images=true.

    - name: Refuse silent demote from plus to non-plus
      when:
        - >
          (on_disk_pangolin.stdout | default('')) is match('^(pangolin-plus/|ghcr\.io/88plug/pangolin-plus/)')
        - >
          not (pangolin_image is match('^(pangolin-plus/|ghcr\.io/88plug/pangolin-plus/)'))
        - not (force_demote | bool)
      fail:
        msg: >-
          On-disk compose uses plus image {{ on_disk_pangolin.stdout }}.
          Target {{ pangolin_image }} is not a pangolin-plus image (would demote off plus).
          Stay on plus (published):
            -e pangolin_image=ghcr.io/88plug/pangolin-plus/pangolin:v1.21.1-plus
            -e gerbil_image=ghcr.io/88plug/pangolin-plus/gerbil:v1.21.1-plus
            -e pull_images=true
          Stay on plus (local):
            -e pangolin_image=pangolin-plus/pangolin:local
            -e gerbil_image=pangolin-plus/gerbil:local
            -e pull_images=false
          Or explicitly -e force_demote=true to switch to stock/other.

    - name: Create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Create timestamped backup
      archive:
        path:
          - "{{ pangolin_dir }}/config"
          - "{{ pangolin_dir }}/docker-compose.yml"
        dest: "{{ backup_dir }}/pangolin-backup-{{ backup_timestamp }}.tar.gz"
        format: gz
      register: backup_result

    - name: Verify backup was created and has content
      stat:
        path: "{{ backup_dir }}/pangolin-backup-{{ backup_timestamp }}.tar.gz"
      register: backup_stat

    - name: Fail if backup is empty or missing
      fail:
        msg: "Backup failed or is empty! Aborting upgrade."
      when: backup_stat.stat.size | default(0) < 1000

    - name: Display backup info
      debug:
        msg: "Backup created: {{ backup_dir }}/pangolin-backup-{{ backup_timestamp }}.tar.gz ({{ backup_stat.stat.size | filesizeformat }})"

    - name: Stop containers gracefully
      shell: cd "{{ pangolin_dir }}" && docker compose down --timeout 30
      register: stop_result
      ignore_errors: true

    # Pure bash/awk rewrite — no python3; image refs only via env (no shell inject)
    - name: Rewrite compose service images from vars
      shell: |
        set -euo pipefail
        f="$COMPOSE_FILE"
        tmp="$(mktemp)"
        awk -v p="$IMG_PANGOLIN" -v g="$IMG_GERBIL" -v t="$IMG_TRAEFIK" '
          /^[[:space:]]*pangolin:[[:space:]]*$/ { svc="pangolin"; print; next }
          /^[[:space:]]*gerbil:[[:space:]]*$/   { svc="gerbil";   print; next }
          /^[[:space:]]*traefik:[[:space:]]*$/  { svc="traefik";  print; next }
          svc != "" && /^[[:space:]]*image:[[:space:]]*/ {
            match($0, /^[[:space:]]*image:[[:space:]]*/)
            if (svc == "pangolin") { print substr($0, 1, RLENGTH) p; done_p = 1 }
            else if (svc == "gerbil") { print substr($0, 1, RLENGTH) g; done_g = 1 }
            else if (svc == "traefik") { print substr($0, 1, RLENGTH) t; done_t = 1 }
            svc = ""
            next
          }
          { print }
          END {
            if (!done_p) { print "could not find image for pangolin" > "/dev/stderr"; exit 1 }
            if (!done_g) { print "could not find image for gerbil" > "/dev/stderr"; exit 1 }
            if (!done_t) { print "could not find image for traefik" > "/dev/stderr"; exit 1 }
          }
        ' "$f" > "$tmp"
        mv "$tmp" "$f"
        echo "rewrote images: pangolin=$IMG_PANGOLIN gerbil=$IMG_GERBIL traefik=$IMG_TRAEFIK"
      args:
        executable: /bin/bash
      environment:
        COMPOSE_FILE: "{{ pangolin_dir }}/docker-compose.yml"
        IMG_PANGOLIN: "{{ pangolin_image }}"
        IMG_GERBIL: "{{ gerbil_image }}"
        IMG_TRAEFIK: "{{ traefik_image }}"
      register: rewrite_images

    - name: Check for monorepo badger source (control node)
      when: resync_badger | bool
      local_action: stat path={{ playbook_dir }}/../components/badger/go.mod
      register: monorepo_badger
      become: false

    - name: Ensure plugins-local path for badger
      when: resync_badger | bool
      file:
        path: "{{ pangolin_dir }}/plugins-local/src/github.com/fosrl"
        state: directory
        mode: '0755'

    - name: Re-sync Badger plugin from monorepo
      when:
        - resync_badger | bool
        - monorepo_badger.stat.exists | default(false)
      copy:
        src: "{{ playbook_dir }}/../components/badger/"
        dest: "{{ pangolin_dir }}/plugins-local/src/github.com/fosrl/badger/"
      register: badger_resync

    - name: Warn when monorepo badger missing on upgrade
      when:
        - resync_badger | bool
        - not (monorepo_badger.stat.exists | default(false))
      debug:
        msg: >-
          WARNING: components/badger not found on control node — skipping badger re-sync.
          Stock localPlugins on the host are left as-is. Re-run from the monorepo
          checkout for plus real-IP, or re-run pangolin.yml.

    - name: Preflight local images present when not pulling
      when: not (pull_images | bool)
      block:
        - name: Inspect local images
          command: docker image inspect {{ pangolin_image }} {{ gerbil_image }}
          register: image_preflight
          changed_when: false
          failed_when: false
        - name: Fail if local images missing
          when: image_preflight.rc != 0
          fail:
            msg: >-
              Images {{ pangolin_image }} / {{ gerbil_image }} not found on this host.
              Run make plus-images and load/transfer them, or set pull_images=true
              with registry image names.

    - name: Pull new images
      when: pull_images | bool
      shell: cd "{{ pangolin_dir }}" && docker compose pull
      register: pull_result
      retries: 3
      delay: 10
      until: pull_result.rc == 0

    - name: Start containers
      shell: cd "{{ pangolin_dir }}" && docker compose up -d --force-recreate
      register: start_result

    # ignore_errors so rollback.sh is still written and operator fail path runs
    - name: Wait for Pangolin to be healthy
      shell: docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' pangolin
      register: health
      until: health.stdout == "healthy"
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      ignore_errors: true

    - name: Get post-upgrade container status
      shell: docker ps --format 'table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Image{{ '}}' }}'
      register: post_containers
      changed_when: false
      ignore_errors: true

    - name: Check if upgrade was successful
      set_fact:
        upgrade_successful: "{{ (health.stdout | default('')) == 'healthy' }}"

    - name: Generate rollback script
      copy:
        dest: "{{ pangolin_dir }}/rollback.sh"
        mode: '0755'
        content: |
          #!/bin/bash
          # Auto-generated rollback script for Pangolin
          # Created: {{ backup_timestamp }}
          # Backup: {{ backup_dir }}/pangolin-backup-{{ backup_timestamp }}.tar.gz

          set -e

          BACKUP_FILE="{{ backup_dir }}/pangolin-backup-{{ backup_timestamp }}.tar.gz"
          PANGOLIN_DIR="{{ pangolin_dir }}"

          echo "=== Pangolin Rollback ==="
          echo "Backup file: $BACKUP_FILE"
          echo ""

          if [ ! -f "$BACKUP_FILE" ]; then
              echo "ERROR: Backup file not found!"
              exit 1
          fi

          echo "Step 1: Stopping containers..."
          cd "$PANGOLIN_DIR"
          docker compose down --timeout 30

          echo "Step 2: Removing current config..."
          rm -rf "$PANGOLIN_DIR/config"
          rm -f "$PANGOLIN_DIR/docker-compose.yml"

          echo "Step 3: Restoring from backup..."
          cd "$PANGOLIN_DIR"
          tar -xzf "$BACKUP_FILE" --strip-components=2

          echo "Step 4: Starting containers..."
          docker compose up -d

          echo "Step 5: Waiting for health check..."
          for i in {1..30}; do
              status=$(docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' pangolin 2>/dev/null || echo "starting")
              echo "  Attempt $i/30: $status"
              if [ "$status" = "healthy" ]; then
                  echo ""
                  echo "=== Rollback successful! ==="
                  docker ps --format 'table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}'
                  exit 0
              fi
              sleep 10
          done

          echo ""
          echo "WARNING: Health check timeout. Check container logs:"
          echo "  docker logs pangolin"
          echo "  docker logs gerbil"
          echo "  docker logs traefik"
          exit 1

    - name: Clean up old backups (keep last N)
      shell: |
        cd "{{ backup_dir }}"
        ls -1t pangolin-backup-*.tar.gz 2>/dev/null | tail -n +{{ backup_retention_count + 1 }} | xargs -r rm -f
      changed_when: false

    - name: Display upgrade result
      debug:
        msg: |

          ============================================
          {% if upgrade_successful %}
          UPGRADE SUCCESSFUL
          {% else %}
          UPGRADE FAILED - Health check timeout
          {% endif %}

          Container status:
          {{ post_containers.stdout }}

          Backup: {{ backup_dir }}/pangolin-backup-{{ backup_timestamp }}.tar.gz

          {% if not upgrade_successful %}
          TO ROLLBACK:
            {{ pangolin_dir }}/rollback.sh

          Or manually:
            cd {{ pangolin_dir }}
            docker compose down
            tar -xzf {{ backup_dir }}/pangolin-backup-{{ backup_timestamp }}.tar.gz -C /opt --strip-components=1
            docker compose up -d
          {% endif %}
          ============================================

    - name: Fail playbook if upgrade was unsuccessful
      fail:
        msg: "Upgrade health check failed. Run {{ pangolin_dir }}/rollback.sh to restore."
      when: not upgrade_successful
