# pangolin-plus product release — GitHub-hosted runners only.
#
# Publishes:
#   Images  → ghcr.io/88plug/pangolin-plus/{pangolin,gerbil,newt,olm}:<tag>
#   Binaries → GitHub Release assets (newt_*, olm_*, gerbil_*)
#
# Tag scheme (plus product; does not fight pure fosrl semver on this repo):
#   v1.21.1-plus   |  1.21.1-plus
#   v1.21.1-plus.rc.1  (RC — no :latest tag)
#
# Maintainer:
#   git tag v1.21.1-plus && git push origin v1.21.1-plus
#   # or: Actions → Plus Release → Run workflow
#   # After first publish: set GHCR package visibility to Public for anonymous pull
#
# Upstream fosrl AWS/Docker Hub pipeline is disabled:
#   .github/workflows/cicd.fosrl-upstream.yml.disabled

name: Plus Release

on:
  push:
    tags:
      - "v*.*.*-plus"
      - "v*.*.*-plus.*"
      - "*.*.*-plus"
      - "*.*.*-plus.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.21.1-plus). Checkout + image/binary labels."
        required: true
        type: string
      dry_run:
        description: "Build only — skip GHCR push and GitHub Release"
        required: false
        type: boolean
        default: false

concurrency:
  group: plus-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

# Workflow defaults: least privilege; jobs raise what they need.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  GO_VERSION: "1.26"
  # Plus product tag allowlist (must match meta validation)
  TAG_ALLOWLIST: '^[v]?[0-9]+\.[0-9]+\.[0-9]+-plus(\.[a-zA-Z0-9.]+)?$'

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_rc: ${{ steps.meta.outputs.is_rc }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      push_images: ${{ steps.meta.outputs.push_images }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          # Never interpolate untrusted inputs into the script body
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_REF: ${{ github.ref }}
          TAG_ALLOWLIST: ${{ env.TAG_ALLOWLIST }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-}"
            DRY_RUN="${INPUT_DRY_RUN:-false}"
            # Dispatch must build the tagged commit, not branch HEAD
            CHECKOUT_REF="$TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            DRY_RUN="false"
            CHECKOUT_REF="$TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "Error: empty tag"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq "$TAG_ALLOWLIST"; then
            echo "Error: tag '$TAG' does not match allowlist $TAG_ALLOWLIST"
            exit 1
          fi
          # APP_VERSION / ldflags: strip leading v only
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-plus(\.[a-zA-Z0-9.]+)?$'; then
            echo "Error: version '$VERSION' failed secondary allowlist"
            exit 1
          fi
          IS_RC="false"
          case "$VERSION" in
            *-rc*|*.rc*|*rc.*) IS_RC="true" ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            PUSH_IMAGES="false"
          else
            PUSH_IMAGES="true"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_rc=$IS_RC"
            echo "dry_run=$DRY_RUN"
            echo "push_images=$PUSH_IMAGES"
            echo "checkout_ref=$CHECKOUT_REF"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION is_rc=$IS_RC dry_run=$DRY_RUN push_images=$PUSH_IMAGES checkout_ref=$CHECKOUT_REF"

  images:
    name: Build & push images
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Set APP_VERSION
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-plus(\.[a-zA-Z0-9.]+)?$'; then
            echo "Error: VERSION failed allowlist: $VERSION"
            exit 1
          fi
          sed -i "s/export const APP_VERSION = \".*\";/export const APP_VERSION = \"$VERSION\";/" server/lib/consts.ts
          if ! grep -q "export const APP_VERSION = \"$VERSION\";" server/lib/consts.ts; then
            echo "Error: APP_VERSION rewrite failed (pattern miss or file changed)"
            grep APP_VERSION server/lib/consts.ts || true
            exit 1
          fi
          grep APP_VERSION server/lib/consts.ts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: needs.meta.outputs.push_images == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platforms & tags
        id: prep
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          IS_RC: ${{ needs.meta.outputs.is_rc }}
          PUSH: ${{ needs.meta.outputs.push_images }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
          for name in pangolin gerbil newt olm; do
            {
              echo "${IMAGE_PREFIX}/${name}:${TAG}"
              if [ "$TAG" != "$VERSION" ]; then
                echo "${IMAGE_PREFIX}/${name}:${VERSION}"
              fi
              if [ "$IS_RC" != "true" ] && [ "$PUSH" = "true" ]; then
                echo "${IMAGE_PREFIX}/${name}:latest"
              fi
            } > "/tmp/tags-${name}.txt"
            {
              echo "tags_${name}<<EOF"
              cat "/tmp/tags-${name}.txt"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "--- ${name} tags ---"
            cat "/tmp/tags-${name}.txt"
          done

      # dry_run (push=false): load amd64 into local docker for entrypoint smoke.
      # Real release: multi-arch push (load is incompatible with multi-platform push).
      - name: Build pangolin
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.prep.outputs.list }}
          push: ${{ needs.meta.outputs.push_images == 'true' }}
          load: ${{ needs.meta.outputs.push_images != 'true' }}
          build-args: |
            BUILD=oss
            DATABASE=sqlite
            VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.prep.outputs.tags_pangolin }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Build gerbil
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: components/gerbil
          file: components/gerbil/Dockerfile
          platforms: ${{ steps.prep.outputs.list }}
          push: ${{ needs.meta.outputs.push_images == 'true' }}
          load: ${{ needs.meta.outputs.push_images != 'true' }}
          tags: ${{ steps.prep.outputs.tags_gerbil }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Build newt
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: components/newt
          file: components/newt/Dockerfile
          platforms: ${{ steps.prep.outputs.list }}
          push: ${{ needs.meta.outputs.push_images == 'true' }}
          load: ${{ needs.meta.outputs.push_images != 'true' }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.prep.outputs.tags_newt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Build olm
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: components/olm
          file: components/olm/Dockerfile
          platforms: ${{ steps.prep.outputs.list }}
          push: ${{ needs.meta.outputs.push_images == 'true' }}
          load: ${{ needs.meta.outputs.push_images != 'true' }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.prep.outputs.tags_olm }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Smoke dry_run loaded images (amd64)
        if: needs.meta.outputs.push_images != 'true'
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          # newt/olm: --version via entrypoint binary; gerbil: presence of binary
          docker run --rm --entrypoint /usr/local/bin/newt "${IMAGE_PREFIX}/newt:${TAG}" --version
          docker run --rm --entrypoint /usr/local/bin/olm "${IMAGE_PREFIX}/olm:${TAG}" --version
          docker run --rm --entrypoint /usr/local/bin/gerbil "${IMAGE_PREFIX}/gerbil:${TAG}" --help >/dev/null 2>&1 \
            || docker run --rm --entrypoint /bin/sh "${IMAGE_PREFIX}/gerbil:${TAG}" -c 'test -x /usr/local/bin/gerbil'
          # pangolin: image must exist (full server start is slow; inspect only)
          docker image inspect "${IMAGE_PREFIX}/pangolin:${TAG}" >/dev/null
          echo "dry_run image load+smoke: OK"

  binaries:
    name: Build client binaries
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            components/newt/go.sum
            components/olm/go.sum
            components/gerbil/go.sum

      - name: Install-script selftest
        run: make plus-install-scripts-selftest

      - name: Build release binaries
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-plus(\.[a-zA-Z0-9.]+)?$'; then
            echo "Error: VERSION failed allowlist: $VERSION"
            exit 1
          fi
          make plus-release-binaries VERSION="$VERSION"

      - name: Smoke --version + SHA256SUMS (linux amd64)
        run: |
          set -euo pipefail
          ./dist/plus/newt_linux_amd64 --version
          ./dist/plus/olm_linux_amd64 --version
          test -x ./dist/plus/gerbil_linux_amd64
          test -f ./dist/plus/SHA256SUMS
          ( cd dist/plus && sha256sum -c SHA256SUMS >/dev/null )
          count=$(find dist/plus -type f ! -name SHA256SUMS | wc -l)
          echo "asset count=$count (expect 20)"
          test "$count" -eq 20

      - name: List dist/plus
        run: ls -la dist/plus/

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plus-binaries-${{ needs.meta.outputs.version }}
          path: dist/plus/
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    # Binary release proceeds even if images fail (clients still need assets).
    needs: [meta, images, binaries]
    if: >-
      always()
      && needs.meta.result == 'success'
      && needs.binaries.result == 'success'
      && needs.meta.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Download binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: plus-binaries-${{ needs.meta.outputs.version }}
          path: dist/plus/

      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IS_RC: ${{ needs.meta.outputs.is_rc }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          set -euo pipefail
          LATEST_NOTE=""
          if [ "$IS_RC" != "true" ]; then
            LATEST_NOTE="- Also tagged \`:latest\` on GHCR (when images job succeeded)"
          else
            LATEST_NOTE="- RC release: no \`:latest\` tag"
          fi
          IMAGES_NOTE=""
          if [ "$IMAGES_RESULT" != "success" ]; then
            IMAGES_NOTE="
          > **Note:** container image job result was \`${IMAGES_RESULT}\`. Binary assets below are still published; re-run the workflow or fix images if GHCR tags are missing.
          "
          fi
          cat > /tmp/release-notes.md << EOF
          ## pangolin-plus ${TAG}

          Community plus monorepo release. Stock fosrl clients/images do **not** include plus deltas.
          ${IMAGES_NOTE}
          ### Container images (GHCR)

          Packages default to **private** on first publish. Maintainer: GitHub → Packages → each of
          \`pangolin\`, \`gerbil\`, \`newt\`, \`olm\` → Package settings → Change visibility → **Public**
          (required for anonymous \`docker pull\`).

          \`\`\`bash
          docker pull ${IMAGE_PREFIX}/pangolin:${TAG}
          docker pull ${IMAGE_PREFIX}/gerbil:${TAG}
          docker pull ${IMAGE_PREFIX}/newt:${TAG}
          docker pull ${IMAGE_PREFIX}/olm:${TAG}
          \`\`\`

          Compose (pull published; do not rebuild):

          \`\`\`bash
          export PANGOLIN_IMAGE=${IMAGE_PREFIX}/pangolin:${TAG}
          export GERBIL_IMAGE=${IMAGE_PREFIX}/gerbil:${TAG}
          export NEWT_IMAGE=${IMAGE_PREFIX}/newt:${TAG}
          docker compose -f compose.plus.yaml pull
          docker compose -f compose.plus.yaml up -d --no-build
          \`\`\`

          ${LATEST_NOTE}

          ### Client binaries

          Assets use upstream naming (\`newt_linux_amd64\`, \`olm_darwin_arm64\`, …).
          Installed name is still \`newt\` / \`olm\` / \`gerbil\`. Checksums: \`SHA256SUMS\`.

          | Component | Role | Example asset |
          |-----------|------|---------------|
          | newt | Site connector | \`newt_linux_amd64\` |
          | olm | End-user client | \`olm_linux_amd64\` (no FreeBSD assets) |
          | gerbil | WG edge (controller) | \`gerbil_linux_amd64\` — **container-first**; binary optional |

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/88plug/pangolin-plus/main/scripts/get-plus-newt.sh | sh
          curl -fsSL https://raw.githubusercontent.com/88plug/pangolin-plus/main/scripts/get-plus-olm.sh | sh
          # Optional host binary (prefer container for controller edge):
          # curl -fsSL https://raw.githubusercontent.com/88plug/pangolin-plus/main/scripts/get-plus-gerbil.sh | sh
          # Pin: VERSION=${TAG} sh get-plus-newt.sh
          \`\`\`

          ### Badger

          Traefik plugin source only — monorepo \`components/badger\` / deploy playbooks as \`localPlugins\`.

          ### Build from source

          \`\`\`bash
          make plus-verify
          make plus-images PLUS_REGISTRY=ghcr.io/88plug/pangolin-plus PLUS_TAG=${VERSION}
          make plus-release-binaries VERSION=${VERSION}
          \`\`\`
          EOF
          sed -i 's/^          //' /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: pangolin-plus ${{ needs.meta.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ needs.meta.outputs.is_rc == 'true' }}
          files: dist/plus/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
