# pangolin-plus product release — GitHub-hosted runners only.
#
# Publishes:
#   Images  → ghcr.io/88plug/pangolin-plus/{pangolin,gerbil,newt,olm}:<tag>
#   Binaries → GitHub Release assets (newt_*, olm_*, gerbil_*)
#
# Tag scheme (plus product; does not fight pure fosrl semver on this repo):
#   v1.21.1-plus   |  1.21.1-plus
#   v1.21.1-plus.rc.1  (RC — no :latest tag)
#
# Maintainer:
#   git tag v1.21.1-plus && git push origin v1.21.1-plus
#   # or: Actions → Plus Release → Run workflow
#
# Upstream fosrl AWS/Docker Hub pipeline is disabled:
#   .github/workflows/cicd.fosrl-upstream.yml.disabled

name: Plus Release

on:
  push:
    tags:
      - "v*.*.*-plus"
      - "v*.*.*-plus.*"
      - "*.*.*-plus"
      - "*.*.*-plus.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.21.1-plus). Used for image/binary version labels."
        required: true
        type: string
      dry_run:
        description: "Build only — skip GHCR push and GitHub Release"
        required: false
        type: boolean
        default: false

concurrency:
  group: plus-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write   # GitHub Releases
  packages: write   # GHCR
  id-token: write   # reserved for optional cosign (not required)

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>/{pangolin,gerbil,newt,olm}
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  GO_VERSION: "1.26"

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_rc: ${{ steps.meta.outputs.is_rc }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      push_images: ${{ steps.meta.outputs.push_images }}
    steps:
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            DRY_RUN="false"
          fi
          if [ -z "$TAG" ]; then
            echo "Error: empty tag"
            exit 1
          fi
          # APP_VERSION / ldflags: strip leading v only
          VERSION="${TAG#v}"
          IS_RC="false"
          case "$VERSION" in
            *-rc*|*.rc*|*rc.*) IS_RC="true" ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            PUSH_IMAGES="false"
          else
            PUSH_IMAGES="true"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_rc=$IS_RC"
            echo "dry_run=$DRY_RUN"
            echo "push_images=$PUSH_IMAGES"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION is_rc=$IS_RC dry_run=$DRY_RUN push_images=$PUSH_IMAGES"

  images:
    name: Build & push images
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set APP_VERSION
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i "s/export const APP_VERSION = \".*\";/export const APP_VERSION = \"$VERSION\";/" server/lib/consts.ts
          grep APP_VERSION server/lib/consts.ts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: needs.meta.outputs.push_images == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platforms & tags
        id: prep
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          IS_RC: ${{ needs.meta.outputs.is_rc }}
          PUSH: ${{ needs.meta.outputs.push_images }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          # Multi-arch on real push; amd64-only smoke on dry_run (QEMU multi-arch is slow)
          if [ "$PUSH" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
          # Multiline tag lists without empty lines (RC / dry_run skip :latest)
          for name in pangolin gerbil newt olm; do
            {
              echo "${IMAGE_PREFIX}/${name}:${TAG}"
              if [ "$TAG" != "$VERSION" ]; then
                echo "${IMAGE_PREFIX}/${name}:${VERSION}"
              fi
              if [ "$IS_RC" != "true" ] && [ "$PUSH" = "true" ]; then
                echo "${IMAGE_PREFIX}/${name}:latest"
              fi
            } > "/tmp/tags-${name}.txt"
            # Expose as single-line CSV for build-push-action (newline → comma)
            tr '\n' ',' < "/tmp/tags-${name}.txt" | sed 's/,$/\n/' > "/tmp/tags-${name}.csv"
            # Also write GITHUB_OUTPUT multiline
            {
              echo "tags_${name}<<EOF"
              cat "/tmp/tags-${name}.txt"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "--- ${name} tags ---"
            cat "/tmp/tags-${name}.txt"
          done

      - name: Build pangolin
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.prep.outputs.list }}
          push: ${{ needs.meta.outputs.push_images == 'true' }}
          build-args: |
            BUILD=oss
            DATABASE=sqlite
            VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.prep.outputs.tags_pangolin }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Build gerbil
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: components/gerbil
          file: components/gerbil/Dockerfile
          platforms: ${{ steps.prep.outputs.list }}
          push: ${{ needs.meta.outputs.push_images == 'true' }}
          tags: ${{ steps.prep.outputs.tags_gerbil }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Build newt
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: components/newt
          file: components/newt/Dockerfile
          platforms: ${{ steps.prep.outputs.list }}
          push: ${{ needs.meta.outputs.push_images == 'true' }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.prep.outputs.tags_newt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Build olm
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: components/olm
          file: components/olm/Dockerfile
          platforms: ${{ steps.prep.outputs.list }}
          push: ${{ needs.meta.outputs.push_images == 'true' }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.prep.outputs.tags_olm }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

  binaries:
    name: Build client binaries
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            components/newt/go.sum
            components/olm/go.sum
            components/gerbil/go.sum

      - name: Build release binaries
        run: make plus-release-binaries VERSION=${{ needs.meta.outputs.version }}

      - name: List dist/plus
        run: ls -la dist/plus/

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plus-binaries-${{ needs.meta.outputs.version }}
          path: dist/plus/
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [meta, images, binaries]
    if: needs.meta.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: plus-binaries-${{ needs.meta.outputs.version }}
          path: dist/plus/

      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IS_RC: ${{ needs.meta.outputs.is_rc }}
        run: |
          set -euo pipefail
          LATEST_NOTE=""
          if [ "$IS_RC" != "true" ]; then
            LATEST_NOTE="- Also tagged \`:latest\` on GHCR"
          else
            LATEST_NOTE="- RC release: no \`:latest\` tag"
          fi
          cat > /tmp/release-notes.md << EOF
          ## pangolin-plus ${TAG}

          Community plus monorepo release. Stock fosrl clients/images do **not** include plus deltas.

          ### Container images (GHCR)

          \`\`\`bash
          docker pull ${IMAGE_PREFIX}/pangolin:${TAG}
          docker pull ${IMAGE_PREFIX}/gerbil:${TAG}
          docker pull ${IMAGE_PREFIX}/newt:${TAG}
          docker pull ${IMAGE_PREFIX}/olm:${TAG}
          \`\`\`

          Compose overrides:

          \`\`\`bash
          export PANGOLIN_IMAGE=${IMAGE_PREFIX}/pangolin:${TAG}
          export GERBIL_IMAGE=${IMAGE_PREFIX}/gerbil:${TAG}
          export NEWT_IMAGE=${IMAGE_PREFIX}/newt:${TAG}
          docker compose -f compose.plus.yaml up -d
          \`\`\`

          ${LATEST_NOTE}

          ### Client binaries

          Assets use upstream naming (\`newt_linux_amd64\`, \`olm_darwin_arm64\`, …).
          Install installed name is still \`newt\` / \`olm\` / \`gerbil\`.

          | Component | Role | Example asset |
          |-----------|------|---------------|
          | newt | Site connector | \`newt_linux_amd64\` |
          | olm | End-user client | \`olm_linux_amd64\` |
          | gerbil | WG edge helper | \`gerbil_linux_amd64\` (linux only) |

          Quick install scripts (from this monorepo):

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/88plug/pangolin-plus/main/scripts/get-plus-newt.sh | sh
          curl -fsSL https://raw.githubusercontent.com/88plug/pangolin-plus/main/scripts/get-plus-olm.sh | sh
          # Pin: VERSION=${TAG} sh get-plus-newt.sh
          \`\`\`

          ### Badger

          Traefik plugin source only — use monorepo \`components/badger\` / deploy playbooks as \`localPlugins\`. Not a release binary or long-running image.

          ### Build from source

          \`\`\`bash
          make plus-verify
          make plus-images PLUS_REGISTRY=ghcr.io/88plug/pangolin-plus PLUS_TAG=${VERSION}
          make plus-release-binaries VERSION=${VERSION}
          \`\`\`
          EOF
          # strip leading spaces from heredoc indent
          sed -i 's/^          //' /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: pangolin-plus ${{ needs.meta.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ needs.meta.outputs.is_rc == 'true' }}
          files: dist/plus/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
