# pangolin-plus full stack — monorepo build *or* published GHCR images.
#
# Local build (default image tags pangolin-plus/*:local):
#   docker compose -f compose.plus.yaml build
#   docker compose -f compose.plus.yaml up -d
#
# Published images (pull only — do not rebuild from source):
#   export TAG=v1.21.1-plus
#   export PANGOLIN_IMAGE=ghcr.io/88plug/pangolin-plus/pangolin:${TAG}
#   export GERBIL_IMAGE=ghcr.io/88plug/pangolin-plus/gerbil:${TAG}
#   export NEWT_IMAGE=ghcr.io/88plug/pangolin-plus/newt:${TAG}
#   docker compose -f compose.plus.yaml pull
#   docker compose -f compose.plus.yaml up -d --no-build
#
# Lab site connector (plus newt against this controller):
#   export NEWT_ID=... NEWT_SECRET=...
#   docker compose -f compose.plus.yaml --profile lab up -d
#
# pull_policy: missing = use local tag if present; set COMPOSE_PULL_POLICY=always
# to force registry pull when IMAGE env points at GHCR.
#
# Roles:
#   pangolin + gerbil + traefik  — control-plane edge (compose services)
#   newt                         — site connector (profile `lab` here, or install binary
#                                  on each site host: scripts/get-plus-newt.sh)
#   olm                          — end-user client binary only (not a compose service):
#                                  scripts/get-plus-olm.sh
#   badger                       — Traefik localPlugins from components/badger (not an image)

name: pangolin-plus

services:
  pangolin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD: oss
        DATABASE: sqlite
    image: ${PANGOLIN_IMAGE:-pangolin-plus/pangolin:local}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: 3s
      timeout: 3s
      retries: 15

  gerbil:
    build:
      context: ./components/gerbil
      dockerfile: Dockerfile
    image: ${GERBIL_IMAGE:-pangolin-plus/gerbil:local}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      # Plus-only static config (localPlugins); stock example uses traefik_config.yml
      - --configFile=/etc/traefik/traefik_config.plus.yml
    environment:
      - XDG_DATA_HOME=/plugins-storage
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/letsencrypt:/letsencrypt
      # Monorepo mined badger (real-IP) as Traefik localPlugins
      - ./components/badger:/plugins-local/src/github.com/fosrl/badger:ro
      - plugins-storage:/plugins-storage

  # Optional lab site connector built from this monorepo (plus newt deltas).
  # Fail-closed: container exits immediately if NEWT_ID/NEWT_SECRET are empty
  # (Compose cannot use ${VAR:?} here — it interpolates even when profile is off).
  # restart: "no" — do not restart-loop when creds are missing; re-up after export.
  #   export NEWT_ID=... NEWT_SECRET=...
  #   docker compose -f compose.plus.yaml --profile lab up -d
  # Production: install the binary on each site host instead of this service:
  #   make -C components/newt local  → components/newt/bin/newt
  newt:
    profiles: ["lab"]
    build:
      context: ./components/newt
      dockerfile: Dockerfile
    image: ${NEWT_IMAGE:-pangolin-plus/newt:local}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    container_name: newt-lab
    restart: "no"
    depends_on:
      pangolin:
        condition: service_healthy
    environment:
      # Bridge DNS reaches the controller; set public URL when newt runs off-host.
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:-http://pangolin:3001}
      NEWT_ID: ${NEWT_ID:-}
      NEWT_SECRET: ${NEWT_SECRET:-}
      NEWT_PREFER_LOCAL_ROUTES: ${NEWT_PREFER_LOCAL_ROUTES:-true}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$NEWT_ID" ] || [ -z "$$NEWT_SECRET" ]; then
          echo "Error: profile lab requires NEWT_ID and NEWT_SECRET (Sites credentials)" >&2
          exit 1
        fi
        exec /entrypoint.sh newt
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun

networks:
  default:
    driver: bridge
    name: pangolin-plus
    enable_ipv6: true

volumes:
  plugins-storage:
